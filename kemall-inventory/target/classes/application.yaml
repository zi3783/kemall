server:
  port: 8085

spring:
  application:
    name: inventory-service
  profiles:
    default: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${ke.addr}:8848
        ip: ${ke.ip}
      config:
        server-addr: ${ke.addr}:8848
        file-extension: yaml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${ke.addr}:3306/inventory_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456

  redis:
    host: redis
    port: 6379


seata:
  enabled: true
  application-id: inventory-service
  tx-service-group: default_tx_group

  # 不使用 Nacos 服务发现
  registry:
    type: file

  config:
    type: file

  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: ${ke.addr}:8091  # 直连宿主机 IP
