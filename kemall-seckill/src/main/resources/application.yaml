server:
  port: 8088

spring:
  application:
    name: seckill-service
  profiles:
    default: local
  cloud:
    nacos:
      discovery:
        server-addr: ${ke.addr}:8848
        ip: ${ke.ip}
      config:
        server-addr: ${ke.addr}:8848
        file-extension: yaml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${ke.addr}:3306/seckill_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456

  redis:
    host: redis
    port: 6379

dubbo:
  application:
    name: seckill-service
    qos-enable: false
  registry:
    address: nacos://${ke.addr}:8848
  protocol:
    name: dubbo
    port: ${ke.dubbo.port:20880}
  scan:
    base-packages: com.kemall.seckill.service
  consumer:
    check: false
