server:
  port: 8088

spring:
  application:
    name: seckill-service
  profiles:
    default: local
  cloud:
    nacos:
      discovery:
        server-addr: ${ke.addr}:8848
        ip: ${ke.ip}
      config:
        server-addr: ${ke.addr}:8848
        file-extension: yaml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${ke.addr}:3306/seckill_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456

  redis:
    host: redis
    port: 6379

  rabbitmq:
    host: ${ke.addr}        # 或直接写 172.24.223.134
    port: 5672
    template:
      mandatory: true
    username: admin
    password: 123456
    virtual-host: /kemall
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: manual

dubbo:
  application:
    name: seckill-service
    qos-enable: false
  registry:
    address: nacos://${ke.addr}:8848
  protocol:
    name: dubbo
    port: ${ke.dubbo.port:20880}
  scan:
    base-packages: com.kemall.seckill.service
  consumer:
    check: false

xxl:
  job:
    admin:
      addresses: http://${ke.addr}:8080/xxl-job-admin  # 调度中心地址
    accessToken: default_token                       # 通讯令牌，需与调度中心一致
    executor:
      appname: seckill-service-executor               # 执行器名称，用于注册分组
      ip:                                              # 执行器IP，留空则自动获取
      port: 9999                                     # 执行器端口，默认9999
      logpath: /data/applogs/xxl-job/jobhandler      # 日志路径
      logretentiondays: 30
