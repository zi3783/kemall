server:
  port: 8087

spring:
  application:
    name: pay-service
  profiles:
    default: local
  cloud:
    nacos:
      discovery:
        server-addr: ${ke.addr}:8848
        ip: ${ke.ip}
      config:
        server-addr: ${ke.addr}:8848
        file-extension: yaml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${ke.addr}:3306/pay_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456

  redis:
    host: redis
    port: 6379

  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

dubbo:
  application:
    name: pay-service
    qos-enable: false
  registry:
    address: nacos://${ke.addr}:8848
  protocol:
    name: dubbo
  scan:
    base-packages: com.kemall.pay.service
  consumer:
    check: false

seata:
  enabled: true
  application-id: pay-service
  tx-service-group: default_tx_group

  # 不使用 Nacos 服务发现
  registry:
    type: file

  config:
    type: file

  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: ${ke.addr}:8091  # 直连宿主机 IP

xxl:
  job:
    admin:
      addresses: http://${ke.addr}:8080/xxl-job-admin  # 调度中心地址
    accessToken: default_token                       # 通讯令牌，需与调度中心一致
    executor:
      appname: xxl-job-executor-sample               # 执行器名称，用于注册分组
      ip:                                              # 执行器IP，留空则自动获取
      port: 9999                                     # 执行器端口，默认9999
      logpath: /data/applogs/xxl-job/jobhandler      # 日志路径
      logretentiondays: 30
