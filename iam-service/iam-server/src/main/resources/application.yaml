server:
  port: 8082

spring:
  application:
    name: iam-service
  profiles:
    default: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${ke.addr}:3306/iam_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 3000


  threads:
    virtual:
      enabled: true


iam:
  jwt:
    # Base64 编码的随机密钥，HS256 至少需要 32 字节
    secret: mK3vT9xQ2pL7wR5nY8cJ4hF6bD1sA0zGqW2eU7iO9rPk
    # 单位：秒
    access-expiration: 1800
    refresh-expiration: 604800
    issuer: iam
    audience: kemall-api