server:
  port: 8082

spring:
  application:
    name: iam-service
  profiles:
    default: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${ke.addr}:3306/iam_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 3000


  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: ${ke.addr}
      port: 6379
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

iam:
  security:
    white-list:
      - /api/iam/v1/auth/login
      - /api/iam/v1/auth/refresh
      - /api/iam/v1/user/register
      - /api/iam/v1/user/password/reset
      - /api/iam/v1/user/verification-code
      - /api/iam/v1/customer/register
      - /doc.html
      - /webjars/**
      - /v3/api-docs
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /error
  jwt:
    # Base64 编码的随机密钥，HS256 至少需要 32 字节
    secret: mK3vT9xQ2pL7wR5nY8cJ4hF6bD1sA0zGqW2eU7iO9rPk
    # 单位：秒
    access-expiration: 1800
    refresh-expiration: 604800
    issuer: iam
    audience: kemall-api
  verification:
    # 验证码有效期（秒）
    ttl-seconds: 300
    # 同一目标发送间隔（秒）
    resend-interval-seconds: 60
    # 最大错误次数
    max-attempts: 5
    # 是否在响应中回显验证码（仅开发环境开启）
    expose-code: true
  permission:
    # 当前会话权限缓存有效期（秒）
    cache-ttl-seconds: 300